# =====================================================
# L3 时效复核观察清单（2026-09-03 更新）
#
# 用途：search_law pipeline 内部在检测到「时效敏感问题 +
# 命中观察清单法律」时，自动通过 web_search（Tavily）做一次
# 现行有效性交叉验证，并把结果并入 Prompt 的 Evidence Context。
#
# 铁律兼容性：复核在服务端 pipeline 内完成，对 LLM/Agent
# 而言 search_law 仍然是 1 次工具调用，不违反
# 「1 次调用后禁止再调检索工具」的收敛约束。
#
# 触发条件（AND）：问题含 trigger_keywords 之一
#               且 问题命中 laws[].name / aliases 之一
# 目的：控制 Tavily 免费额度（1000 次/月）消耗。
#
# 版本核对记录（2026-09-03 网络核查）：
#   证券法：2019.12.28 第二次修订，2020-03-01 施行（L2 报告误报 2025 修订，已纠正）
#   刑法：修正案（十二）2023.12.29 通过，2024-03-01 施行
#   劳动法：2018.12.29 第二次修正
#   劳动合同法：2012.12.28 修正，2013-07-01 施行
#   公司法：2023.12.29 第二次修订（重大修订），2024-07-01 施行 ⚠️ 重点确认
#   民法典：2020.5.28 通过，2021-01-01 施行（无修正）
#   民法典合同编通则司法解释：法释〔2023〕13 号，2023-12-05 施行
#   企业破产法：2006.8.27 通过，2007-06-01 施行（修订草案二审中，尚未通过）
#   公司法司法解释：5 项（一～五）+ 时间效力规定（法释〔2024〕7 号，2024-07-01 施行）
#     注：2025.9.30 最高法发布新公司法司法解释征求意见稿，尚未正式出台
# =====================================================

enabled: true

max_results: 4        # 单次 Tavily 返回结果数（≤5）

trigger_keywords:
  - 最新
  - 现行
  - 修订
  - 修正
  - 废止
  - 效力
  - 有效
  - 2023
  - 2024
  - 2025
  - 2026
  - 新公司法
  - 新规

# 观察清单内的法律才会触发复核（query 缺省时自动生成
# "《{name}》 最新修订 现行有效 施行日期"）
laws:

  - name: 公司法
    # 当前有效版本：2023.12.29 第二次修订（重大修订），2024-07-01 施行
    # 风险等级：高 — 新旧条文差异大，旧版引用会导致严重错误
    aliases:
      - 新公司法
    query: 新公司法 2023修订 现行有效 施行日期

  - name: 民法典
    # 当前有效版本：2020.5.28 通过，2021-01-01 施行（无修正）
    query: 中华人民共和国民法典 现行有效 施行日期

  - name: 民法典合同编通则司法解释
    # 当前有效版本：法释〔2023〕13 号，2023-12-05 施行
    aliases:
      - 合同编通则司法解释
    query: 最高人民法院 民法典合同编通则司法解释 法释 现行有效 施行

  - name: 劳动法
    # 当前有效版本：2018.12.29 第二次修正

  - name: 劳动合同法
    # 当前有效版本：2012.12.28 修正，2013-07-01 施行

  - name: 企业破产法
    # 当前有效版本：2006.8.27 通过，2007-06-01 施行
    # 注意：修订草案 2025.9 一审、2026.8 二审，尚未通过，持续关注

  - name: 证券法
    # 当前有效版本：2019.12.28 第二次修订，2020-03-01 施行
    # 注：L2 报告误报"2025 修订"，经 2026-09-03 核查确认无此修订

  - name: 刑法
    # 当前有效版本：修正案（十二）2023.12.29 通过，2024-03-01 施行
    # 风险等级：中 — 需确认本地 KB 是否已含修正案（十二）条文

  - name: 公司法司法解释
    # 现行有效：5 项（一～五）+ 时间效力规定（法释〔2024〕7 号，2024-07-01 施行）
    # 注意：2025.9.30 最高法发布新公司法司法解释征求意见稿，尚未正式出台
    #       2026.5 最高法表态"加快出台公司法司法解释"
