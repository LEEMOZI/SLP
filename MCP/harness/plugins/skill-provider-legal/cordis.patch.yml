# @law-agent/skill-provider-legal cordis.patch.yml
#
# DSH 补丁合法格式：顶层 YAML 数组（loader patch entries）。
# 本插件向 Cordis 注册一个 SkillProvider，将 skills/*.json 文件
# 动态加载为 DSH 可识别的技能包，替代静态 JSON 卡片方案。
#
# 唯一真相源：MCP/harness/skills/*.json
# 设计文档：MCP/HARNESS_PLUGIN_ARCHITECTURE.md 第六节 扩展点 #6

- insert:
    # ====================================================================
    # 技能动态激活插件
    # ====================================================================
    - id: skill-provider-legal
      name: '@law-agent/skill-provider-legal'
      config:
        # ----------------------------------------------------------------
        # 技能文件扫描目录
        # 该目录下的所有 *.json 文件会被解析为技能定义
        # ----------------------------------------------------------------
        skillsDir: /Users/simon/Documents/1-SLP/MCP/harness/skills

        # ----------------------------------------------------------------
        # 技能刷新间隔（秒）
        # 0 = 禁用自动刷新（仅启动时加载一次）
        # > 0 = 每隔 N 秒检查文件变化并重新加载
        # ----------------------------------------------------------------
        refreshIntervalSec: 0

        # ----------------------------------------------------------------
        # 日志级别
        #   'error' — 仅错误
        #   'warn'  — 错误 + 警告（默认）
        #   'info'  — 错误 + 警告 + 加载/卸载事件
        #   'debug' — 详细调试信息
        # ----------------------------------------------------------------
        logLevel: warn
