name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（如 v0.2.0），留空则跳过 Release 步骤"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/workbench/frontend/package-lock.json

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r apps/capability_adapter/requirements.txt
          pip install -r apps/workbench/requirements.txt
          pip install pyinstaller

      - name: Install frontend dependencies
        run: |
          cd apps/workbench/frontend
          npm ci

      - name: Build frontend
        run: |
          cd apps/workbench/frontend
          npm run build

      - name: Build Python services (PyInstaller)
        run: |
          source .venv/bin/activate
          # 打包 sidecar
          pyinstaller \
            --name slp-sidecar \
            --onefile \
            --clean \
            --noconfirm \
            --paths . \
            --hidden-import apps.capability_adapter \
            --hidden-import apps.capability_adapter.app \
            --hidden-import apps.capability_adapter.parser \
            --hidden-import apps.capability_adapter.retrieval \
            --hidden-import apps.capability_adapter.judgments \
            --hidden-import apps.capability_adapter.summarizer \
            --hidden-import apps.capability_adapter.review_generator \
            --hidden-import apps.capability_adapter.litigation_generator \
            --hidden-import fitz \
            --hidden-import docx \
            --collect-all apps.capability_adapter \
            apps/workbench/scripts/slp_sidecar_entry.py
          # 打包 workbench
          pyinstaller \
            --name slp-workbench \
            --onefile \
            --clean \
            --noconfirm \
            --paths . \
            --hidden-import apps.workbench.backend \
            --hidden-import apps.workbench.backend.app \
            --collect-all apps.workbench.backend \
            apps/workbench/scripts/slp_workbench_entry.py

      - name: Collect Tauri resources
        run: |
          RESOURCES_DIR="apps/workbench/frontend/src-tauri/resources"
          mkdir -p "$RESOURCES_DIR/binaries" "$RESOURCES_DIR/frontend-dist"
          cp dist/slp-sidecar "$RESOURCES_DIR/binaries/"
          cp dist/slp-workbench "$RESOURCES_DIR/binaries/"
          chmod +x "$RESOURCES_DIR/binaries/"*
          cp -R apps/workbench/frontend/dist/. "$RESOURCES_DIR/frontend-dist/"
          echo "Resources collected:"
          ls -lh "$RESOURCES_DIR/binaries/"
          du -sh "$RESOURCES_DIR/frontend-dist/"

      - name: Build Tauri app
        working-directory: apps/workbench/frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          npx tauri build --bundles app

      - name: Bundle resources into .app
        run: |
          APP_DIR="apps/workbench/frontend/src-tauri/target/release/bundle/macos/SLP 法律工作台.app"
          RES_DIR="$APP_DIR/Contents/Resources"
          mkdir -p "$RES_DIR/binaries" "$RES_DIR/frontend/dist"
          cp apps/workbench/frontend/src-tauri/resources/binaries/* "$RES_DIR/binaries/"
          cp -R apps/workbench/frontend/src-tauri/resources/frontend-dist/. "$RES_DIR/frontend/dist/"
          chmod +x "$RES_DIR/binaries/"*
          echo "Bundled resources:"
          ls -lh "$RES_DIR/binaries/"

      - name: Create DMG
        run: |
          APP_DIR="apps/workbench/frontend/src-tauri/target/release/bundle/macos/SLP 法律工作台.app"
          DMG_DIR="apps/workbench/frontend/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          VERSION="${RELEASE_TAG#v}"
          hdiutil create \
            -volname "SLP 法律工作台" \
            -srcfolder "$APP_DIR" \
            -ov -format UDZO \
            "$DMG_DIR/SLP-Workbench-${VERSION}.dmg"

      - name: Create updater tarball
        working-directory: apps/workbench/frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          OUT_DIR="src-tauri/target/release/bundle/macos"
          cd "$OUT_DIR"
          tar -czf "slp-workbench_${VERSION}_aarch64-apple-darwin.app.tar.gz" "SLP 法律工作台.app"
          cd "$GITHUB_WORKSPACE/apps/workbench/frontend"
          npx tauri signer sign "$OUT_DIR/slp-workbench_${VERSION}_aarch64-apple-darwin.app.tar.gz" \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY"
          SIG=$(cat "$OUT_DIR/slp-workbench_${VERSION}_aarch64-apple-darwin.app.tar.gz.sig")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > "$OUT_DIR/latest.json" <<EOF
          {
            "version": "${VERSION}",
            "notes": "SLP 法律工作台 ${RELEASE_TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/slp-workbench_${VERSION}_aarch64-apple-darwin.app.tar.gz"
              }
            }
          }
          EOF
          ls -lh "$OUT_DIR"/*.tar.gz "$OUT_DIR"/*.sig "$OUT_DIR"/latest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slp-workbench-macos
          path: |
            apps/workbench/frontend/src-tauri/target/release/bundle/dmg/*.dmg
            apps/workbench/frontend/src-tauri/target/release/bundle/macos/*.tar.gz
            apps/workbench/frontend/src-tauri/target/release/bundle/macos/*.sig
            apps/workbench/frontend/src-tauri/target/release/bundle/macos/latest.json
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(env.RELEASE_TAG, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(ls apps/workbench/frontend/src-tauri/target/release/bundle/dmg/*.dmg)
          TARBALL=$(ls apps/workbench/frontend/src-tauri/target/release/bundle/macos/*.tar.gz)
          SIG=$(ls apps/workbench/frontend/src-tauri/target/release/bundle/macos/*.sig)
          LATEST_JSON=$(ls apps/workbench/frontend/src-tauri/target/release/bundle/macos/latest.json)
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release exists, uploading assets"
            gh release upload "${RELEASE_TAG}" "$DMG" "$TARBALL" "$SIG" "$LATEST_JSON" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --title "SLP 法律工作台 ${RELEASE_TAG}" \
              --notes "一键安装、自动更新的法律工作台桌面应用。下载 .dmg 安装，应用支持自动更新。" \
              --draft \
              "$DMG" "$TARBALL" "$SIG" "$LATEST_JSON"
          fi


