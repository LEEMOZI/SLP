name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/workbench/frontend/package-lock.json

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r apps/capability_adapter/requirements.txt
          pip install -r apps/workbench/requirements.txt
          pip install pyinstaller

      - name: Install frontend dependencies
        run: |
          cd apps/workbench/frontend
          npm ci

      - name: Build frontend
        run: |
          cd apps/workbench/frontend
          npm run build

      - name: Build Python services (PyInstaller)
        run: |
          source .venv/bin/activate
          # 打包 sidecar
          pyinstaller \
            --name slp-sidecar \
            --onefile \
            --clean \
            --noconfirm \
            --paths . \
            --hidden-import apps.capability_adapter \
            --hidden-import apps.capability_adapter.app \
            --hidden-import apps.capability_adapter.parser \
            --hidden-import apps.capability_adapter.retrieval \
            --hidden-import apps.capability_adapter.judgments \
            --hidden-import apps.capability_adapter.summarizer \
            --hidden-import apps.capability_adapter.review_generator \
            --hidden-import apps.capability_adapter.litigation_generator \
            --hidden-import fitz \
            --hidden-import docx \
            --collect-all apps.capability_adapter \
            apps/workbench/scripts/slp_sidecar_entry.py
          # 打包 workbench
          pyinstaller \
            --name slp-workbench \
            --onefile \
            --clean \
            --noconfirm \
            --paths . \
            --hidden-import apps.workbench.backend \
            --hidden-import apps.workbench.backend.app \
            --collect-all apps.workbench.backend \
            apps/workbench/scripts/slp_workbench_entry.py

      - name: Collect Tauri resources
        run: |
          RESOURCES_DIR="apps/workbench/frontend/src-tauri/resources"
          mkdir -p "$RESOURCES_DIR/binaries" "$RESOURCES_DIR/frontend-dist"
          cp dist/slp-sidecar "$RESOURCES_DIR/binaries/"
          cp dist/slp-workbench "$RESOURCES_DIR/binaries/"
          chmod +x "$RESOURCES_DIR/binaries/"*
          cp -R apps/workbench/frontend/dist/. "$RESOURCES_DIR/frontend-dist/"
          echo "Resources collected:"
          ls -lh "$RESOURCES_DIR/binaries/"
          du -sh "$RESOURCES_DIR/frontend-dist/"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/workbench/frontend
          tagName: ${{ github.ref_name }}
          releaseName: "SLP 法律工作台 ${{ github.ref_name }}"
          releaseBody: |
            ## SLP 法律工作台
            一键安装、自动更新的法律工作台桌面应用。

            ### 安装
            下载 `.dmg` 文件，拖入 Applications 即可。

            ### 更新
            应用支持自动更新，启动时自动检查新版本。
          releaseDraft: true
          prerelease: false


